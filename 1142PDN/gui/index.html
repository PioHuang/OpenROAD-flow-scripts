<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1142PDN — voltage &amp; IR drop</title>
    <script
      src="https://cdn.plot.ly/plotly-2.35.2.min.js"
      charset="utf-8"
    ></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0e;
        --panel: #18181b;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid #27272a;
        background: var(--panel);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.15rem;
        font-weight: 600;
      }
      .sub {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
        margin-top: 12px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input[type="text"] {
        width: min(420px, 100%);
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #3f3f46;
        background: #09090b;
        color: var(--text);
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      .flags {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #0c0c0e;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85rem;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        font-size: 0.8rem;
        color: var(--muted);
      }
      #plots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px;
        max-width: 1800px;
        margin: 0 auto;
      }
      @media (max-width: 960px) {
        #plots {
          grid-template-columns: 1fr;
        }
      }
      .plot-wrap {
        background: var(--panel);
        border-radius: 10px;
        border: 1px solid #27272a;
        padding: 8px;
        min-height: 420px;
      }
      .plot-title {
        font-size: 0.9rem;
        font-weight: 600;
        padding: 4px 8px 8px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>1142PDN mesh viewer</h1>
      <div class="sub">
        Heatmaps plus graph overlays from <code>ir_mesh_nodes.tsv</code>,
        <code>edges.tsv</code>, and <code>VDD_instance_ir.rpt</code>. Optional
        <code>pdn_from_odb_*.tsv</code> (from ORFS after <code>pdngen</code>).
        Use root absolute paths (with leading <code>/</code>).
      </div>
      <div class="toolbar">
        <label>
          Mesh nodes TSV
          <input
            id="meshPath"
            type="text"
            value="/out/latest/ir_mesh_nodes.tsv"
            spellcheck="false"
          />
        </label>
        <label>
          Graph edges TSV
          <input
            id="edgesPath"
            type="text"
            value="/out/latest/edges.tsv"
            spellcheck="false"
          />
        </label>
        <label>
          Instance IR report
          <input
            id="instPath"
            type="text"
            value="/out/latest/VDD_instance_ir.rpt"
            spellcheck="false"
          />
        </label>
        <label>
          Instance regions TSV
          <input
            id="regionsPath"
            type="text"
            value="/out/latest/instance_regions.tsv"
            spellcheck="false"
          />
        </label>
        <label>
          Voltage sources TSV
          <input
            id="vsrcPath"
            type="text"
            value="/out/latest/vsrc.tsv"
            spellcheck="false"
          />
        </label>
        <label>
          PDN vias (ODB) TSV
          <input
            id="pdnViasPath"
            type="text"
            value="/out/latest/pdn_from_odb_vias.tsv"
            spellcheck="false"
          />
        </label>
        <label>
          PDN wires (ODB) TSV
          <input
            id="pdnWiresPath"
            type="text"
            value="/out/latest/pdn_from_odb_wires.tsv"
            spellcheck="false"
          />
        </label>
        <div class="flags">
          <label><input id="showEdges" type="checkbox" checked />Edges</label>
          <label><input id="showNodes" type="checkbox" />Nodes</label>
          <label
            ><input id="showLoads" type="checkbox" checked />Load nodes</label
          >
          <label
            ><input id="showMacroPins" type="checkbox" checked />Hard macro
            VDD pins</label
          >
          <label><input id="showVsrc" type="checkbox" checked />Vsrc</label>
          <label
            ><input id="showPdnOdb" type="checkbox" checked />Real PDN (ODB)</label
          >
          <label>
            Edge style
            <select id="edgeStyle">
              <option value="plain">Plain</option>
              <option value="direction">Direction (H/V)</option>
              <option value="conductance">Conductance (g_S)</option>
            </select>
          </label>
        </div>
        <button id="loadBtn" type="button">Load / refresh</button>
        <span id="status"></span>
      </div>
    </header>
    <div id="plots">
      <div class="plot-wrap">
        <div class="plot-title" id="titleV">Node voltage (V)</div>
        <div id="plotVoltage" style="width: 100%; height: 400px"></div>
      </div>
      <div class="plot-wrap">
        <div class="plot-title" id="titleIR">IR drop (V)</div>
        <div id="plotIr" style="width: 100%; height: 400px"></div>
      </div>
      <div class="plot-wrap">
        <div class="plot-title" id="titleGraph">Built graph / geometry</div>
        <div id="plotGraph" style="width: 100%; height: 400px"></div>
      </div>
      <div class="plot-wrap">
        <div class="plot-title" id="titleRegions">Clusters / hard macros</div>
        <div id="plotRegions" style="width: 100%; height: 400px"></div>
      </div>
    </div>
    <script>
      const meshInput = document.getElementById("meshPath");
      const edgesInput = document.getElementById("edgesPath");
      const instInput = document.getElementById("instPath");
      const regionsInput = document.getElementById("regionsPath");
      const vsrcInput = document.getElementById("vsrcPath");
      const pdnViasInput = document.getElementById("pdnViasPath");
      const pdnWiresInput = document.getElementById("pdnWiresPath");
      const loadBtn = document.getElementById("loadBtn");
      const statusEl = document.getElementById("status");
      const showEdgesEl = document.getElementById("showEdges");
      const showNodesEl = document.getElementById("showNodes");
      const showLoadsEl = document.getElementById("showLoads");
      const showMacroPinsEl = document.getElementById("showMacroPins");
      const showVsrcEl = document.getElementById("showVsrc");
      const showPdnOdbEl = document.getElementById("showPdnOdb");
      const edgeStyleEl = document.getElementById("edgeStyle");

      function parseMeshTsv(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) throw new Error("empty TSV");
        const header = lines[0].split("\t");
        const ixI = header.indexOf("ix");
        const iyI = header.indexOf("iy");
        const xI = header.indexOf("x_um");
        const yI = header.indexOf("y_um");
        const iTotalI = header.indexOf("i_total_A");
        const vI = header.indexOf("v_V");
        const irI = header.indexOf("ir_drop_V");
        if (ixI < 0 || iyI < 0 || vI < 0 || irI < 0)
          throw new Error("missing ix, iy, v_V, or ir_drop_V columns");
        const rows = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line) continue;
          const c = line.split("\t");
          rows.push({
            ix: parseInt(c[ixI], 10),
            iy: parseInt(c[iyI], 10),
            x_um: parseFloat(c[xI]),
            y_um: parseFloat(c[yI]),
            i_total_A: iTotalI >= 0 ? parseFloat(c[iTotalI]) : 0,
            v_V: parseFloat(c[vI]),
            ir_drop_V: parseFloat(c[irI]),
          });
        }
        return rows;
      }

      function parseEdgesTsv(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const header = lines[0].split("\t");
        const x1I = header.indexOf("x1_um");
        const y1I = header.indexOf("y1_um");
        const x2I = header.indexOf("x2_um");
        const y2I = header.indexOf("y2_um");
        const gI = header.indexOf("g_S");
        if (x1I < 0 || y1I < 0 || x2I < 0 || y2I < 0) {
          throw new Error("edges.tsv missing x1/y1/x2/y2 columns");
        }
        const out = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line) continue;
          const c = line.split("\t");
          out.push({
            x1_um: parseFloat(c[x1I]),
            y1_um: parseFloat(c[y1I]),
            x2_um: parseFloat(c[x2I]),
            y2_um: parseFloat(c[y2I]),
            g_S: gI >= 0 ? parseFloat(c[gI]) : null,
          });
        }
        return out;
      }

      function parseInstanceIrReport(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const header = lines[0].split(",");
        const instI = header.indexOf("Instance");
        const xI = header.indexOf("X location");
        const yI = header.indexOf("Y location");
        if (instI < 0 || xI < 0 || yI < 0) {
          throw new Error("instance IR report missing Instance/X/Y columns");
        }
        const rows = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line) continue;
          const c = line.split(",");
          rows.push({
            instance: c[instI],
            x_um: parseFloat(c[xI]),
            y_um: parseFloat(c[yI]),
          });
        }
        return rows;
      }

      function parseRegionsTsv(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const header = lines[0].split("\t");
        const nameI = header.indexOf("instance");
        const kindI = header.indexOf("kind");
        const llxI = header.indexOf("llx_um");
        const llyI = header.indexOf("lly_um");
        const urxI = header.indexOf("urx_um");
        const uryI = header.indexOf("ury_um");
        if ([nameI, kindI, llxI, llyI, urxI, uryI].some((i) => i < 0)) {
          throw new Error("instance_regions.tsv missing required columns");
        }
        const out = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line) continue;
          const c = line.split("\t");
          out.push({
            instance: c[nameI],
            kind: c[kindI],
            llx_um: parseFloat(c[llxI]),
            lly_um: parseFloat(c[llyI]),
            urx_um: parseFloat(c[urxI]),
            ury_um: parseFloat(c[uryI]),
          });
        }
        return out.filter(
          (r) =>
            Number.isFinite(r.llx_um) &&
            Number.isFinite(r.lly_um) &&
            Number.isFinite(r.urx_um) &&
            Number.isFinite(r.ury_um) &&
            r.urx_um >= r.llx_um &&
            r.ury_um >= r.lly_um,
        );
      }

      function parseVsrcTsv(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const header = lines[0].split("\t");
        const cxI = header.indexOf("cx_um");
        const cyI = header.indexOf("cy_um");
        const llxI = header.indexOf("llx_um");
        const llyI = header.indexOf("lly_um");
        const urxI = header.indexOf("urx_um");
        const uryI = header.indexOf("ury_um");
        const vI = header.indexOf("voltage_V");
        if ([cxI, cyI, llxI, llyI, urxI, uryI, vI].some((i) => i < 0)) {
          throw new Error("vsrc.tsv missing required columns");
        }
        const out = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line) continue;
          const c = line.split("\t");
          out.push({
            cx_um: parseFloat(c[cxI]),
            cy_um: parseFloat(c[cyI]),
            llx_um: parseFloat(c[llxI]),
            lly_um: parseFloat(c[llyI]),
            urx_um: parseFloat(c[urxI]),
            ury_um: parseFloat(c[uryI]),
            voltage_V: parseFloat(c[vI]),
          });
        }
        return out;
      }

      function parsePdnViasOdbTsv(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const headerLine = lines[0].replace(/^\#+\s*/, "");
        const header = headerLine.split("\t");
        const xI = header.indexOf("x_um");
        const yI = header.indexOf("y_um");
        const llxI = header.indexOf("llx_um");
        const llyI = header.indexOf("lly_um");
        const urxI = header.indexOf("urx_um");
        const uryI = header.indexOf("ury_um");
        const lowI = header.indexOf("lower_layer");
        const upI = header.indexOf("upper_layer");
        const viaI = header.indexOf("via_name");
        const netI = header.indexOf("net");
        if ([xI, yI, llxI, llyI, urxI, uryI, netI].some((i) => i < 0)) {
          throw new Error("pdn vias TSV: need x_um,y_um, bbox, net columns");
        }
        const out = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line || line.startsWith("#")) continue;
          const c = line.split("\t");
          out.push({
            x_um: parseFloat(c[xI]),
            y_um: parseFloat(c[yI]),
            llx_um: parseFloat(c[llxI]),
            lly_um: parseFloat(c[llyI]),
            urx_um: parseFloat(c[urxI]),
            ury_um: parseFloat(c[uryI]),
            lower_layer: lowI >= 0 ? c[lowI] : "",
            upper_layer: upI >= 0 ? c[upI] : "",
            via_name: viaI >= 0 ? c[viaI] : "",
            net: c[netI],
          });
        }
        return out.filter(
          (r) =>
            Number.isFinite(r.x_um) &&
            Number.isFinite(r.y_um) &&
            Number.isFinite(r.llx_um),
        );
      }

      function parsePdnWiresOdbTsv(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const headerLine = lines[0].replace(/^\#+\s*/, "");
        const header = headerLine.split("\t");
        const llxI = header.indexOf("llx_um");
        const llyI = header.indexOf("lly_um");
        const urxI = header.indexOf("urx_um");
        const uryI = header.indexOf("ury_um");
        const layerI = header.indexOf("layer");
        const shapeI = header.indexOf("shape");
        const dirI = header.indexOf("direction");
        const netI = header.indexOf("net");
        if ([llxI, llyI, urxI, uryI, netI].some((i) => i < 0)) {
          throw new Error("pdn wires TSV: need llx/lly/urx/ury_um and net");
        }
        const out = [];
        for (let li = 1; li < lines.length; li++) {
          const line = lines[li].trim();
          if (!line || line.startsWith("#")) continue;
          const c = line.split("\t");
          out.push({
            llx_um: parseFloat(c[llxI]),
            lly_um: parseFloat(c[llyI]),
            urx_um: parseFloat(c[urxI]),
            ury_um: parseFloat(c[uryI]),
            layer: layerI >= 0 ? c[layerI] : "",
            shape: shapeI >= 0 ? c[shapeI] : "",
            dir: dirI >= 0 ? c[dirI] : "",
            net: c[netI],
          });
        }
        return out.filter(
          (r) =>
            Number.isFinite(r.llx_um) &&
            Number.isFinite(r.urx_um) &&
            r.urx_um >= r.llx_um &&
            r.ury_um >= r.lly_um,
        );
      }

      function macroPinsFromInstanceRows(rows) {
        const byInst = new Map();
        for (const row of rows) {
          if (!Number.isFinite(row.x_um) || !Number.isFinite(row.y_um)) continue;
          const arr = byInst.get(row.instance) || [];
          arr.push(row);
          byInst.set(row.instance, arr);
        }
        const macroPins = [];
        for (const [, instRows] of byInst) {
          const uniq = new Map();
          for (const row of instRows) {
            const k = `${row.x_um.toFixed(4)},${row.y_um.toFixed(4)}`;
            if (!uniq.has(k)) uniq.set(k, row);
          }
          if (uniq.size > 1) {
            for (const pin of uniq.values()) macroPins.push(pin);
          }
        }
        return macroPins;
      }

      function buildHeatmapData(rows) {
        const ixs = [...new Set(rows.map((r) => r.ix))].sort((a, b) => a - b);
        const iys = [...new Set(rows.map((r) => r.iy))].sort((a, b) => a - b);
        const key = (ix, iy) => `${ix},${iy}`;
        const map = new Map(rows.map((r) => [key(r.ix, r.iy), r]));
        const xAxis = ixs.map((ix) => {
          const r = rows.find((row) => row.ix === ix);
          return r.x_um;
        });
        const yAxis = iys.map((iy) => {
          const r = rows.find((row) => row.iy === iy);
          return r.y_um;
        });
        const zV = iys.map((iy) =>
          ixs.map((ix) => {
            const r = map.get(key(ix, iy));
            return r ? r.v_V : null;
          }),
        );
        const zIr = iys.map((iy) =>
          ixs.map((ix) => {
            const r = map.get(key(ix, iy));
            return r ? r.ir_drop_V : null;
          }),
        );
        return { xAxis, yAxis, zV, zIr, n: rows.length };
      }

      function stats2d(z) {
        let minV = Infinity;
        let maxV = -Infinity;
        let sum = 0;
        let count = 0;
        for (const row of z) {
          for (const v of row) {
            if (v == null || Number.isNaN(v)) continue;
            minV = Math.min(minV, v);
            maxV = Math.max(maxV, v);
            sum += v;
            count++;
          }
        }
        const mean = count ? sum / count : 0;
        return { minV, maxV, mean, count };
      }

      function heatmapLayout(title) {
        return {
          paper_bgcolor: "#18181b",
          plot_bgcolor: "#18181b",
          font: { color: "#e4e4e7", size: 11 },
          title: { text: title, font: { size: 13 } },
          xaxis: {
            title: "x (µm)",
            gridcolor: "#3f3f46",
            zeroline: false,
          },
          yaxis: {
            title: "y (µm)",
            gridcolor: "#3f3f46",
            zeroline: false,
            scaleanchor: "x",
            scaleratio: 1,
          },
          margin: { t: 48, r: 24, b: 56, l: 64 },
        };
      }

      function meshFetchUrl(raw) {
        const trimmed = raw.trim();
        if (!trimmed) return null;
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        if (trimmed.startsWith("/")) return trimmed;
        return `/${trimmed.replace(/^\/+/, "")}`;
      }

      function withOverlays(data, overlays) {
        if (Array.isArray(overlays.edges)) data.push(...overlays.edges);
        else if (overlays.edges) data.push(overlays.edges);
        if (overlays.nodes?.length) data.push(overlays.nodes);
        if (overlays.loads?.length) data.push(overlays.loads);
        if (overlays.macroPins?.length) data.push(overlays.macroPins);
        if (overlays.vsrcCenters) data.push(overlays.vsrcCenters);
        if (overlays.vsrcPadNodes) data.push(overlays.vsrcPadNodes);
        if (overlays.pdnWiresOdb) data.push(overlays.pdnWiresOdb);
        if (overlays.pdnViasOdb) data.push(overlays.pdnViasOdb);
        return data;
      }

      function buildEdgeTrace(edges, style) {
        if (!edges.length) return null;
        const mkLineTrace = (subset, name, color, extra = "") => {
          const x = [];
          const y = [];
          const hoverText = [];
          for (const e of subset) {
            x.push(e.x1_um, e.x2_um, null);
            y.push(e.y1_um, e.y2_um, null);
            hoverText.push(
              `x1 ${e.x1_um.toFixed(2)} µm<br>y1 ${e.y1_um.toFixed(2)} µm<br>x2 ${e.x2_um.toFixed(2)} µm<br>y2 ${e.y2_um.toFixed(2)} µm${extra ? `<br>${extra(e)}` : ""}`,
              "",
              "",
            );
          }
          return {
            type: "scattergl",
            mode: "lines",
            x,
            y,
            text: hoverText,
            line: { color, width: 1.2 },
            name,
            hovertemplate: "%{text}<extra></extra>",
          };
        };
        if (style === "direction") {
          const h = edges.filter((e) => Math.abs(e.y2_um - e.y1_um) < 1e-9);
          const v = edges.filter((e) => Math.abs(e.x2_um - e.x1_um) < 1e-9);
          return [
            mkLineTrace(h, "H edges", "rgba(56,189,248,0.55)"),
            mkLineTrace(v, "V edges", "rgba(244,114,182,0.55)"),
          ];
        }
        if (style === "conductance") {
          const valid = edges.filter((e) => Number.isFinite(e.g_S));
          if (!valid.length) {
            return [mkLineTrace(edges, "Graph edges", "rgba(212,212,216,0.20)")];
          }
          const gVals = valid.map((e) => e.g_S).sort((a, b) => a - b);
          const q = (p) => gVals[Math.min(gVals.length - 1, Math.floor((gVals.length - 1) * p))];
          const bins = [
            { lo: -Infinity, hi: q(0.2), color: "rgba(37,99,235,0.50)" },
            { lo: q(0.2), hi: q(0.4), color: "rgba(16,185,129,0.50)" },
            { lo: q(0.4), hi: q(0.6), color: "rgba(234,179,8,0.50)" },
            { lo: q(0.6), hi: q(0.8), color: "rgba(249,115,22,0.50)" },
            { lo: q(0.8), hi: Infinity, color: "rgba(239,68,68,0.50)" },
          ];
          return bins
            .map((b, i) =>
              mkLineTrace(
                valid.filter((e) => e.g_S >= b.lo && e.g_S <= b.hi),
                `Edges g_S q${i + 1}`,
                b.color,
                (e) => `g_S ${e.g_S.toExponential(3)}`,
              ),
            )
            .filter((t) => t.x.length > 0);
        }
        const x = [];
        const y = [];
        for (const e of edges) {
          x.push(e.x1_um, e.x2_um, null);
          y.push(e.y1_um, e.y2_um, null);
        }
        return [
          {
            type: "scattergl",
            mode: "lines",
            x,
            y,
            line: { color: "rgba(212,212,216,0.20)", width: 1 },
            name: "Graph edges",
            hoverinfo: "skip",
          },
        ];
      }

      function buildNodeTrace(rows) {
        return {
          type: "scattergl",
          mode: "markers",
          x: rows.map((r) => r.x_um),
          y: rows.map((r) => r.y_um),
          marker: { size: 3, color: "rgba(250,250,250,0.35)" },
          name: "Mesh nodes",
          hovertemplate: "x %{x:.2f} µm<br>y %{y:.2f} µm<extra>node</extra>",
        };
      }

      function buildLoadTrace(rows) {
        const loadRows = rows.filter((r) => Number(r.i_total_A) > 0);
        return {
          type: "scattergl",
          mode: "markers",
          x: loadRows.map((r) => r.x_um),
          y: loadRows.map((r) => r.y_um),
          marker: {
            size: 7,
            color: loadRows.map((r) => r.i_total_A),
            colorscale: "Turbo",
            opacity: 0.9,
            colorbar: { title: "Load A", len: 0.45, y: 0.2 },
          },
          name: "Load sites",
          hovertemplate:
            "x %{x:.2f} µm<br>y %{y:.2f} µm<br>I %{marker.color:.4g} A<extra></extra>",
        };
      }

      function nearestIndex(axis, value) {
        let bestI = 0;
        let bestD = Infinity;
        for (let i = 0; i < axis.length; i++) {
          const d = Math.abs(axis[i] - value);
          if (d < bestD) {
            bestD = d;
            bestI = i;
          }
        }
        return bestI;
      }

      function enrichMacroPinsWithNearestNode(pins, xAxis, yAxis) {
        const nx = xAxis.length;
        return pins.map((p) => {
          const ix = nearestIndex(xAxis, p.x_um);
          const iy = nearestIndex(yAxis, p.y_um);
          return {
            ...p,
            ix,
            iy,
            nodeIndex: iy * nx + ix,
            node_x_um: xAxis[ix],
            node_y_um: yAxis[iy],
          };
        });
      }

      function buildMacroPinTrace(pins) {
        return {
          type: "scattergl",
          mode: "markers",
          x: pins.map((p) => p.x_um),
          y: pins.map((p) => p.y_um),
          marker: {
            size: 8,
            symbol: "diamond",
            color: "#f43f5e",
            line: { color: "#ffe4e6", width: 1 },
          },
          name: "Hard macro VDD pins",
          hovertemplate:
            "%{text}<br>x %{x:.2f} µm<br>y %{y:.2f} µm<br>nearest node idx %{customdata[0]} (ix=%{customdata[1]}, iy=%{customdata[2]})<br>node x %{customdata[3]:.2f} µm, y %{customdata[4]:.2f} µm<extra>macro pin</extra>",
          text: pins.map((p) => p.instance),
          customdata: pins.map((p) => [
            p.nodeIndex,
            p.ix,
            p.iy,
            p.node_x_um,
            p.node_y_um,
          ]),
        };
      }

      function buildRegionRectTrace(rows, kind, color, name) {
        const selected = rows.filter((r) => r.kind === kind);
        if (!selected.length) return null;
        const x = [];
        const y = [];
        const text = [];
        for (const r of selected) {
          x.push(r.llx_um, r.urx_um, r.urx_um, r.llx_um, r.llx_um, null);
          y.push(r.lly_um, r.lly_um, r.ury_um, r.ury_um, r.lly_um, null);
          text.push(r.instance, "", "", "", "", "");
        }
        return {
          type: "scattergl",
          mode: "lines",
          x,
          y,
          text,
          line: { color, width: 2 },
          name,
          hovertemplate: "%{text}<extra></extra>",
        };
      }

      function gridDimensionsFromMesh(meshRows) {
        const nx = Math.max(...meshRows.map((r) => r.ix), 0) + 1;
        const ny = Math.max(...meshRows.map((r) => r.iy), 0) + 1;
        return { nx, ny };
      }

      function meshNodesInsideVsrcPads(vsrcRows, meshRows) {
        if (!vsrcRows.length || !meshRows.length) return [];
        const { nx } = gridDimensionsFromMesh(meshRows);
        const out = [];
        for (const row of meshRows) {
          const padsHit = [];
          for (let pi = 0; pi < vsrcRows.length; pi++) {
            const pad = vsrcRows[pi];
            if (
              row.x_um >= pad.llx_um &&
              row.x_um <= pad.urx_um &&
              row.y_um >= pad.lly_um &&
              row.y_um <= pad.ury_um
            ) {
              padsHit.push({ pi, voltage_V: pad.voltage_V });
            }
          }
          if (!padsHit.length) continue;
          const flat = row.iy * nx + row.ix;
          const padDesc = padsHit
            .map(
              (p) =>
                `pad#${p.pi} V=${p.voltage_V.toFixed(4)}`,
            )
            .join("<br>");
          out.push({
            x_um: row.x_um,
            y_um: row.y_um,
            ix: row.ix,
            iy: row.iy,
            flatIndex: flat,
            hover: `Vsrc mesh node<br>flat ${flat} (ix=${row.ix}, iy=${row.iy})<br>x ${row.x_um.toFixed(2)} µm, y ${row.y_um.toFixed(2)} µm<br>${padDesc}`,
          });
        }
        return out;
      }

      function buildVsrcCenterTrace(vsrcRows) {
        if (!vsrcRows.length) return null;
        return {
          type: "scattergl",
          mode: "markers",
          x: vsrcRows.map((r) => r.cx_um),
          y: vsrcRows.map((r) => r.cy_um),
          marker: {
            size: 11,
            symbol: "cross",
            color: "#22d3ee",
            line: { color: "#ecfeff", width: 1 },
          },
          name: "Vsrc centers",
          hovertemplate:
            "Voltage source (pad center)<br>x %{x:.2f} µm<br>y %{y:.2f} µm<br>V %{customdata[0]:.4f}<br><sub>Pad mesh nodes: separate trace</sub><extra></extra>",
          customdata: vsrcRows.map((r) => [r.voltage_V]),
        };
      }

      function buildVsrcPadMeshNodeTrace(padNodes) {
        if (!padNodes.length) return null;
        return {
          type: "scattergl",
          mode: "markers",
          x: padNodes.map((p) => p.x_um),
          y: padNodes.map((p) => p.y_um),
          marker: {
            size: 9,
            symbol: "square",
            color: "rgba(34,211,238,0.75)",
            line: { color: "#cffafe", width: 0.5 },
          },
          name: "Vsrc pad mesh nodes",
          text: padNodes.map((p) => p.hover),
          hovertemplate: "%{text}<extra></extra>",
        };
      }

      function buildPdnWireOdbTrace(rows) {
        if (!rows.length) return null;
        const x = [];
        const y = [];
        const text = [];
        for (const r of rows) {
          x.push(r.llx_um, r.urx_um, r.urx_um, r.llx_um, r.llx_um, null);
          y.push(r.lly_um, r.lly_um, r.ury_um, r.ury_um, r.lly_um, null);
          text.push(
            `${r.net} ${r.layer} ${r.shape} ${r.dir}`,
            "",
            "",
            "",
            "",
            "",
          );
        }
        return {
          type: "scattergl",
          mode: "lines",
          x,
          y,
          text,
          line: { color: "rgba(250,204,21,0.42)", width: 1 },
          name: "PDN wires (ODB)",
          hovertemplate: "%{text}<extra></extra>",
        };
      }

      function buildPdnViaOdbTrace(rows) {
        if (!rows.length) return null;
        return {
          type: "scattergl",
          mode: "markers",
          x: rows.map((r) => r.x_um),
          y: rows.map((r) => r.y_um),
          marker: {
            size: 5,
            symbol: "circle",
            color: "rgba(168,85,247,0.88)",
            line: { color: "#faf5ff", width: 0.3 },
          },
          name: "PDN vias (ODB)",
          text: rows.map(
            (r) =>
              `${r.net}<br>${r.via_name}<br>${r.lower_layer} → ${r.upper_layer}<br>center ${r.x_um.toFixed(2)}, ${r.y_um.toFixed(2)} µm`,
          ),
          hovertemplate: "%{text}<extra></extra>",
        };
      }

      async function loadMesh() {
        const meshPath = meshFetchUrl(meshInput.value);
        const edgesPath = meshFetchUrl(edgesInput.value);
        const instPath = meshFetchUrl(instInput.value);
        const regionsPath = meshFetchUrl(regionsInput.value);
        const vsrcPath = meshFetchUrl(vsrcInput.value);
        const pdnViasPath = meshFetchUrl(pdnViasInput.value);
        const pdnWiresPath = meshFetchUrl(pdnWiresInput.value);
        if (!meshPath) {
          statusEl.textContent = "Enter mesh path.";
          return;
        }
        loadBtn.disabled = true;
        statusEl.textContent = "Loading…";
        try {
          const [
            meshRes,
            edgesRes,
            instRes,
            regionsRes,
            vsrcRes,
            pdnViasRes,
            pdnWiresRes,
          ] = await Promise.all([
            fetch(encodeURI(meshPath), { cache: "no-store" }),
            edgesPath
              ? fetch(encodeURI(edgesPath), { cache: "no-store" })
              : Promise.resolve(null),
            instPath
              ? fetch(encodeURI(instPath), { cache: "no-store" })
              : Promise.resolve(null),
            regionsPath
              ? fetch(encodeURI(regionsPath), { cache: "no-store" })
              : Promise.resolve(null),
            vsrcPath
              ? fetch(encodeURI(vsrcPath), { cache: "no-store" })
              : Promise.resolve(null),
            pdnViasPath
              ? fetch(encodeURI(pdnViasPath), { cache: "no-store" })
              : Promise.resolve(null),
            pdnWiresPath
              ? fetch(encodeURI(pdnWiresPath), { cache: "no-store" })
              : Promise.resolve(null),
          ]);
          const res = meshRes;
          if (!res.ok) throw new Error(`HTTP ${res.status} for ${meshPath}`);
          const rows = parseMeshTsv(await res.text());
          const edges =
            edgesRes && edgesRes.ok ? parseEdgesTsv(await edgesRes.text()) : [];
          const instRows =
            instRes && instRes.ok
              ? parseInstanceIrReport(await instRes.text())
              : [];
          const regions =
            regionsRes && regionsRes.ok
              ? parseRegionsTsv(await regionsRes.text())
              : [];
          const vsrcRows =
            vsrcRes && vsrcRes.ok ? parseVsrcTsv(await vsrcRes.text()) : [];
          let pdnViaRows = [];
          let pdnWireRows = [];
          if (pdnViasRes && pdnViasRes.ok) {
            pdnViaRows = parsePdnViasOdbTsv(await pdnViasRes.text());
          }
          if (pdnWiresRes && pdnWiresRes.ok) {
            pdnWireRows = parsePdnWiresOdbTsv(await pdnWiresRes.text());
          }
          const macroPinsRaw = macroPinsFromInstanceRows(instRows);
          const { xAxis, yAxis, zV, zIr, n } = buildHeatmapData(rows);
          const macroPins = enrichMacroPinsWithNearestNode(
            macroPinsRaw,
            xAxis,
            yAxis,
          );
          const sV = stats2d(zV);
          const sIr = stats2d(zIr);
          document.getElementById(
            "titleV",
          ).textContent = `Node voltage (V) — min ${sV.minV.toFixed(4)}  max ${sV.maxV.toFixed(4)}  mean ${sV.mean.toFixed(4)}  (${n} nodes)`;
          document.getElementById(
            "titleIR",
          ).textContent = `IR drop (V) — min ${sIr.minV.toFixed(4)}  max ${sIr.maxV.toFixed(4)}  mean ${sIr.mean.toFixed(4)}`;

          const vsrcPadNodes =
            showVsrcEl.checked && vsrcRows.length
              ? meshNodesInsideVsrcPads(vsrcRows, rows)
              : [];
          const vsrcCentersTrace =
            showVsrcEl.checked && vsrcRows.length
              ? buildVsrcCenterTrace(vsrcRows)
              : null;
          const vsrcPadNodesTrace =
            showVsrcEl.checked && vsrcPadNodes.length
              ? buildVsrcPadMeshNodeTrace(vsrcPadNodes)
              : null;

          const pdnWiresTrace =
            showPdnOdbEl.checked && pdnWireRows.length
              ? buildPdnWireOdbTrace(pdnWireRows)
              : null;
          const pdnViasTrace =
            showPdnOdbEl.checked && pdnViaRows.length
              ? buildPdnViaOdbTrace(pdnViaRows)
              : null;

          const overlays = {
            edges:
              showEdgesEl.checked && edges.length
                ? buildEdgeTrace(edges, edgeStyleEl.value)
                : null,
            nodes: showNodesEl.checked ? buildNodeTrace(rows) : null,
            loads: showLoadsEl.checked ? buildLoadTrace(rows) : null,
            macroPins:
              showMacroPinsEl.checked && macroPins.length
                ? buildMacroPinTrace(macroPins)
                : null,
            vsrcCenters: vsrcCentersTrace,
            vsrcPadNodes: vsrcPadNodesTrace,
            pdnWiresOdb: pdnWiresTrace,
            pdnViasOdb: pdnViasTrace,
          };
          const clusterTrace = buildRegionRectTrace(
            regions,
            "cluster",
            "rgba(34,197,94,0.9)",
            "Clusters",
          );
          const hardMacroTrace = buildRegionRectTrace(
            regions,
            "hard_macro",
            "rgba(244,63,94,0.9)",
            "Hard macro regions",
          );
          await Plotly.react(
            "plotVoltage",
            withOverlays(
              [
              {
                type: "heatmap",
                x: xAxis,
                y: yAxis,
                z: zV,
                zmin: sV.minV - 1e-9,
                zmax: sV.maxV + 1e-9,
                colorscale: "Viridis",
                hovertemplate:
                  "x %{x:.2f} µm<br>y %{y:.2f} µm<br>V %{z:.5f}<extra></extra>",
                colorbar: { title: "V" },
              },
            ],
              overlays,
            ),
            heatmapLayout("Voltage map"),
            { responsive: true },
          );

          await Plotly.react(
            "plotIr",
            withOverlays(
              [
              {
                type: "heatmap",
                x: xAxis,
                y: yAxis,
                z: zIr,
                zmin: 0,
                zmax: Math.max(sIr.maxV * 1.05, 1e-9),
                colorscale: [
                  [0, "#0b1220"],
                  [0.35, "#1e3a5f"],
                  [0.55, "#b45309"],
                  [0.75, "#ea580c"],
                  [1, "#fef08a"],
                ],
                hovertemplate:
                  "x %{x:.2f} µm<br>y %{y:.2f} µm<br>IR %{z:.5f} V<extra></extra>",
                colorbar: { title: "V drop" },
              },
            ],
              overlays,
            ),
            heatmapLayout("IR drop map"),
            { responsive: true },
          );

          const graphData = [];
          if (overlays.edges) graphData.push(overlays.edges);
          if (overlays.nodes) graphData.push(overlays.nodes);
          if (overlays.loads) graphData.push(overlays.loads);
          if (overlays.macroPins) graphData.push(overlays.macroPins);
          if (vsrcCentersTrace) graphData.push(vsrcCentersTrace);
          if (vsrcPadNodesTrace) graphData.push(vsrcPadNodesTrace);
          if (pdnWiresTrace) graphData.push(pdnWiresTrace);
          if (pdnViasTrace) graphData.push(pdnViasTrace);
          await Plotly.react(
            "plotGraph",
            graphData,
            heatmapLayout("Built graph + hard macro pins"),
            { responsive: true },
          );
          const regionsData = [];
          if (clusterTrace) regionsData.push(clusterTrace);
          if (hardMacroTrace) regionsData.push(hardMacroTrace);
          if (overlays.macroPins) regionsData.push(overlays.macroPins);
          if (vsrcCentersTrace) regionsData.push(vsrcCentersTrace);
          if (vsrcPadNodesTrace) regionsData.push(vsrcPadNodesTrace);
          if (pdnWiresTrace) regionsData.push(pdnWiresTrace);
          if (pdnViasTrace) regionsData.push(pdnViasTrace);
          await Plotly.react(
            "plotRegions",
            regionsData,
            heatmapLayout("Cluster/hard-macro regions"),
            { responsive: true },
          );
          const clusterCount = regions.filter((r) => r.kind === "cluster").length;
          const hardCount = regions.filter((r) => r.kind === "hard_macro").length;
          document.getElementById(
            "titleRegions",
          ).textContent = `Clusters / hard macros — clusters ${clusterCount}  hard macros ${hardCount}`;
          document.getElementById(
            "titleGraph",
          ).textContent = `Built graph / geometry — edges ${edges.length}  macro pins ${macroPins.length}  PDN vias ${pdnViaRows.length}  PDN wire boxes ${pdnWireRows.length}`;
          statusEl.textContent = `Loaded ${n} mesh nodes from ${meshPath}`;
        } catch (e) {
          console.error(e);
          statusEl.textContent = String(e.message || e);
        } finally {
          loadBtn.disabled = false;
        }
      }

      loadBtn.addEventListener("click", () => loadMesh());
      showEdgesEl.addEventListener("change", () => loadMesh());
      showNodesEl.addEventListener("change", () => loadMesh());
      showLoadsEl.addEventListener("change", () => loadMesh());
      showMacroPinsEl.addEventListener("change", () => loadMesh());
      showVsrcEl.addEventListener("change", () => loadMesh());
      showPdnOdbEl.addEventListener("change", () => loadMesh());
      edgeStyleEl.addEventListener("change", () => loadMesh());
      loadMesh();
    </script>
  </body>
</html>
